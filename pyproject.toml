[project]
name = "ceviribro"
version = "3.0.0"
description = "DeepL destekli, klavye odaklı anlık çeviri arayüzü."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "textual>=8.0",
    "deepl>=1.18",
    "pyperclip>=1.8",
    "python-dotenv>=1.0",
]

[project.scripts]
ceviribro = "ceviribro.app:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["ceviribro"]

[tool.setuptools.package-data]
ceviribro = ["*.tcss"]
