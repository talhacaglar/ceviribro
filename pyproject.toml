[project]
name = "ceviri-tui"
version = "2.1.0"
description = "DeepL destekli, klavye odaklı anlık çeviri arayüzü."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "textual>=8.0",
    "deepl>=1.18",
    "pyperclip>=1.8",
    "python-dotenv>=1.0",
]

[project.scripts]
ceviri = "ceviri_tui.app:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["ceviri_tui"]

[tool.setuptools.package-data]
ceviri_tui = ["*.tcss"]
